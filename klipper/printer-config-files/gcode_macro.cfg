[gcode_macro G29]
description: Marlin-like G29 (bed mesh calibration)
gcode:
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
# BED_MESH_PROFILE save=default
# BED_MESH_PROFILE load=default

[gcode_macro PRINT_START]
description: Alias for START_PRINT
gcode:
    START_PRINT {rawparams}

# Shared print start sequence used by slicer start G-code.
[gcode_macro START_PRINT]
description: Start print
gcode:
    # Fail before heating or homing if the filament switch is empty.
    {% if not printer["filament_switch_sensor filament_sensor"].filament_detected %}
        {action_raise_error("No filament detected by the filament sensor")}
    {% endif %}

    # Prefer the first-layer bed temperature. Some slicers expose BED_TEMP as
    # the maximum bed temperature used anywhere in the print.
    {% set bed = params.FIRST_LAYER_BED_TEMP
        |default(params.BED_TEMP_FIRST_LAYER)
        |default(params.BED_TEMP_INITIAL_LAYER)
        |default(params.BED_TEMPERATURE_INITIAL_LAYER)
        |default(params.BED_TEMP)
        |default(params.BED)
        |default(60)|float %}
    {% set hotend = params.EXTRUDER_TEMP|default(params.EXTRUDER)|default(200)|float %}

    G90                           ; Absolute positioning
    M82                           ; Absolute extrusion mode
    M220 S100                     ; Reset feedrate
    M221 S100                     ; Reset flowrate

    ; Heat bed first to reduce mesh drift.
    M140 S{bed}                   ; Set bed temp (no wait)
    G28 X Y                       ; Home XY
    M190 S{bed}                   ; Wait for bed temp

    ; Probe with the bed at temperature, then heat the nozzle.
    G28 Z                         ; Home Z / load mesh as configured
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1 ; Or: BED_MESH_PROFILE LOAD=default

    M104 S{hotend}                ; Set nozzle temp (no wait)
    G90                           ; Ensure absolute positioning after probing
    G1 X-2.0 Y20 Z0.3 F5000.0      ; Move to start position
    M109 S{hotend}                ; Wait for nozzle temp

    M82                           ; Ensure absolute extrusion mode
    G92 E0                        ; Reset extruder
    G1 Z0.2                       ; Lower nozzle to printing height
    G1 Y145.0 F1500.0 E15         ; Prime line
    G1 X-1.7 F5000.0
    G1 Y30 F1500.0 E15
    G92 E0

[gcode_macro PRINT_END]
description: Alias for END_PRINT
gcode:
    END_PRINT {rawparams}

# Shared print end sequence: retract, lift, park, and cool down.
[gcode_macro END_PRINT]
description: End print
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set z_hop = [20.0, max_z - current_z]|min %}

    M400                         ; Wait for buffer to clear
    G92 E0                       ; Reset extruder position

; Retract (relative extruder move), then restore extruder mode
    M83                          ; Extruder relative
    G1 E-1.2 F1800               ; Retract
    M82                          ; Extruder absolute

; Z hop, limited to the configured Z maximum
    {% if z_hop > 0 %}
    G91                          ; Relative positioning
    G1 Z{z_hop} F1800
    G90                          ; Absolute positioning
    {% else %}
    G90                          ; Absolute positioning
    {% endif %}

; Present print (ensure Z is already lifted)
    G1 X2 Y218 F3000

; Heaters and fan off
    M106 S0
    M104 S0
    M140 S0

; Disable steppers but keep Z enabled
    M84 X Y E

[gcode_macro LOAD_FILAMENT]
description: Heat, then load filament into the hotend
gcode:
    {% set temp = params.TEMP|default(220)|float %}
    {% set load_length = params.LENGTH|default(75)|float %}
    {% set purge_length = params.PURGE_LENGTH|default(25)|float %}
    {% set speed = params.SPEED|default(300)|float %}
    {% set purge_speed = params.PURGE_SPEED|default(120)|float %}

    {% if printer.extruder.temperature < temp - 5 %}
        M109 S{temp}
    {% endif %}

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
    M83
    G92 E0
    G1 E{load_length} F{speed}
    G1 E{purge_length} F{purge_speed}
    G92 E0
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE

[gcode_macro UNLOAD_FILAMENT]
description: Heat, then unload filament from the hotend
gcode:
    {% set temp = params.TEMP|default(220)|float %}
    {% set retract_length = params.LENGTH|default(85)|float %}
    {% set tip_length = params.TIP_LENGTH|default(8)|float %}
    {% set speed = params.SPEED|default(900)|float %}
    {% set tip_speed = params.TIP_SPEED|default(120)|float %}

    {% if printer.extruder.temperature < temp - 5 %}
        M109 S{temp}
    {% endif %}

    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    M83
    G92 E0
    G1 E{tip_length} F{tip_speed}
    G1 E-{retract_length} F{speed}
    G92 E0
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
